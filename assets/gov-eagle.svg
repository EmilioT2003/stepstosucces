<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .eagle-primary { fill: #000000; }
      .eagle-accent { fill: #DC143C; }
      .eagle-gold { fill: #FFD700; }
    </style>
  </defs>
  
  <!-- Eagle body -->
  <path class="eagle-primary" d="M50 15 C60 15, 70 25, 70 35 C70 45, 65 55, 55 60 L55 75 C55 80, 50 85, 50 85 C50 85, 45 80, 45 75 L45 60 C35 55, 30 45, 30 35 C30 25, 40 15, 50 15 Z"/>
  
  <!-- Eagle wings spread -->
  <path class="eagle-primary" d="M30 35 C20 30, 10 35, 5 45 C0 55, 5 65, 15 70 C25 75, 35 70, 40 60 C35 50, 30 40, 30 35 Z"/>
  <path class="eagle-primary" d="M70 35 C80 30, 90 35, 95 45 C100 55, 95 65, 85 70 C75 75, 65 70, 60 60 C65 50, 70 40, 70 35 Z"/>
  
  <!-- Eagle head -->
  <circle class="eagle-primary" cx="50" cy="25" r="8"/>
  
  <!-- Beak -->
  <path class="eagle-accent" d="M42 25 L37 23 L42 21 Z"/>
  
  <!-- Eye -->
  <circle class="eagle-gold" cx="47" cy="23" r="1.5"/>
  
  <!-- Talon details -->
  <path class="eagle-accent" d="M45 80 L40 85 M50 80 L50 85 M55 80 L60 85"/>
  
  <!-- Wing detail lines -->
  <path class="eagle-accent" d="M25 50 C30 45, 35 50, 30 55" stroke-width="1" fill="none"/>
  <path class="eagle-accent" d="M75 50 C70 45, 65 50, 70 55" stroke-width="1" fill="none"/>
</svg>